<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#145de9">
<title>Udara Samarinda</title>
<style>
:root{
  --bg1:#216af0;--bg2:#0e4fda;--fg:#fff;--muted:#dce8ff;
  --good:#22c55e;--moderate:#f6c445;--unhealthy:#f08a45;--very:#e24d6b;--haz:#a855f7
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#eef4ff}
body{display:grid;place-items:center;padding:10px}
.widget{width:min(100%,760px);min-height:320px;border-radius:32px;color:var(--fg);
background:linear-gradient(145deg,var(--bg1),var(--bg2));padding:24px 26px;box-shadow:0 18px 42px rgba(20,70,160,.22)}
.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.eyebrow{font-size:13px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);font-weight:800}
h1{font-size:28px;line-height:1.05;margin:4px 0 0}
.source{font-size:13px;color:var(--muted);margin-top:6px}
.refresh{border:0;background:rgba(255,255,255,.13);color:#fff;border-radius:14px;width:44px;height:44px;font-size:23px}
.value{font-size:clamp(68px,19vw,116px);font-weight:850;line-height:.82;letter-spacing:-.06em;margin-top:26px}
.unit{font-size:24px;font-weight:650;margin-left:8px;color:var(--muted);letter-spacing:0}
.meta{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:10px 14px;font-size:15px;font-weight:800;background:#fff;color:#13213a}
.dot{width:10px;height:10px;border-radius:50%;background:var(--moderate)}
.trend{font-size:18px;font-weight:700;color:#eef4ff}
.updated{margin-top:16px;font-size:14px;color:var(--muted);font-weight:650}
.bar{height:9px;border-radius:99px;margin-top:18px;background:linear-gradient(90deg,var(--good) 0 20%,var(--moderate) 20% 40%,var(--unhealthy) 40% 60%,var(--very) 60% 80%,var(--haz) 80% 100%);position:relative}
.marker{position:absolute;top:50%;width:5px;height:23px;background:#fff;border:1px solid rgba(0,0,0,.18);border-radius:5px;transform:translate(-50%,-50%);left:20%}
.footer{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:13px;font-size:12px;color:var(--muted)}
.error{display:none;margin-top:12px;padding:9px 12px;border-radius:12px;background:rgba(120,0,0,.2);font-size:12px}
@media(max-width:520px){
 body{
   padding:12px;
   background:transparent;
   display:flex;
   justify-content:center;
   align-items:flex-start;
 }

 .widget{
   width:min(92vw,430px);
   min-height:0;
   border-radius:26px;
   padding:18px;
   margin:0 auto;
 }

 .eyebrow{
   font-size:11px;
 }

 h1{
   font-size:22px;
 }

 .source{
   display:none;
 }

 .refresh{
   width:40px;
   height:40px;
   font-size:20px;
 }

 .value{
   font-size:78px;
   margin-top:18px;
 }

 .unit{
   font-size:19px;
   margin-left:6px;
 }

 .meta{
   margin-top:14px;
   gap:8px;
 }

 .pill{
   padding:8px 12px;
   font-size:14px;
 }

 .trend{
   font-size:16px;
 }

 .updated{
   margin-top:12px;
   font-size:12px;
 }

 .bar{
   margin-top:14px;
 }

 .footer{
   margin-top:10px;
   font-size:10px;
   gap:6px;
 }
}
</style>
</head>
<body>
<main class="widget">
  <div class="top">
    <div>
      <div class="eyebrow">Pemantauan kualitas udara</div>
      <h1>Udara Samarinda</h1>
      <div class="source">Sumber: BMKG APT Pranoto Samarinda</div>
    </div>
    <button class="refresh" onclick="loadData(true)" aria-label="Segarkan">↻</button>
  </div>

  <div><span id="value" class="value">--</span><span class="unit">µg/m³</span></div>

  <div class="meta">
    <span class="pill"><span id="dot" class="dot"></span><span id="status">Memuat…</span></span>
    <span id="trend" class="trend">—</span>
  </div>

  <div id="updated" class="updated">Mengambil data BMKG…</div>
  <div class="bar"><span id="marker" class="marker"></span></div>

  <div class="footer">
    <span id="checked">Sumber diperiksa: —</span>
    <span>Pengukuran mengikuti ketersediaan BMKG</span>
  </div>
  <div id="error" class="error"></div>
</main>

<script>
const colors={"Baik":"#22c55e","Sedang":"#f6c445","Tidak Sehat":"#f08a45","Sangat Tidak Sehat":"#e24d6b","Berbahaya":"#a855f7"};
function markerPosition(v){
 if(v<=15.5)return(v/15.5)*20;
 if(v<=55.4)return 20+((v-15.5)/(55.4-15.5))*20;
 if(v<=150.4)return 40+((v-55.4)/(150.4-55.4))*20;
 if(v<=250.4)return 60+((v-150.4)/(250.4-150.4))*20;
 return Math.min(98,80+((v-250.4)/150)*20);
}
async function loadData(force=false){
 const err=document.getElementById("error"); err.style.display="none";
 try{
   const res=await fetch("data.json?"+(force?Date.now():"v=1"),{cache:"no-store"});
   if(!res.ok)throw new Error("HTTP "+res.status);
   const d=await res.json();
   document.getElementById("value").textContent=Number(d.value).toFixed(1);
   document.getElementById("status").textContent=d.status;
   document.getElementById("trend").textContent=(d.trend==="Meningkat"?"↗":d.trend==="Menurun"?"↘":"→")+" "+d.trend;
   document.getElementById("updated").textContent="Update BMKG: "+d.updated;
   document.getElementById("checked").textContent="Sumber diperiksa: "+d.checked;
   document.getElementById("dot").style.background=colors[d.status]||"#fff";
   document.getElementById("marker").style.left=markerPosition(Number(d.value))+"%";
 }catch(e){
   err.textContent="Data belum tersedia. Tekan ↻ beberapa saat lagi.";
   err.style.display="block";
 }
}
loadData();
setInterval(()=>loadData(true),5*60*1000);
</script>
</body>
</html>
