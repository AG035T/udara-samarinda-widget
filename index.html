<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#145de9">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Udara Samarinda</title>

<style>
:root{
  --bg1:#216af0;
  --bg2:#0e4fda;
  --fg:#ffffff;
  --muted:#dce8ff;
  --good:#22c55e;
  --moderate:#f6c445;
  --unhealthy:#f08a45;
  --very:#e24d6b;
  --haz:#a855f7;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  background:transparent;
}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  padding:12px;
  overflow:hidden;
}

.widget{
  width:min(420px,calc(100vw - 24px));
  aspect-ratio:1 / 1;
  color:var(--fg);
  background:linear-gradient(145deg,var(--bg1),var(--bg2));
  border-radius:28px;
  padding:22px;
  box-shadow:0 16px 38px rgba(20,70,160,.25);
  overflow:hidden;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px;
}

.eyebrow{
  font-size:11px;
  letter-spacing:.10em;
  text-transform:uppercase;
  font-weight:800;
  color:var(--muted);
  white-space:nowrap;
}

h1{
  margin:4px 0 0;
  font-size:25px;
  line-height:1.05;
}

.refresh{
  flex:0 0 auto;
  width:42px;
  height:42px;
  border:0;
  border-radius:13px;
  background:rgba(255,255,255,.14);
  color:#fff;
  font-size:21px;
}

.value-row{
  display:flex;
  align-items:flex-end;
  gap:8px;
  margin-top:27px;
  white-space:nowrap;
}

.value{
  font-size:clamp(58px,14vw,82px);
  font-weight:850;
  line-height:.82;
  letter-spacing:-.055em;
}

.unit{
  padding-bottom:8px;
  font-size:19px;
  line-height:1;
  font-weight:700;
  color:var(--muted);
}

.meta{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:22px;
  white-space:nowrap;
}

.pill{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:9px 13px;
  border-radius:999px;
  background:#fff;
  color:#13213a;
  font-size:14px;
  font-weight:800;
}

.dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:var(--moderate);
}

.trend{
  font-size:15px;
  font-weight:750;
  color:#eef4ff;
}

.updated{
  margin-top:20px;
  font-size:12px;
  font-weight:700;
  color:var(--muted);
  white-space:nowrap;
}

.bar{
  position:relative;
  height:9px;
  margin-top:18px;
  border-radius:99px;
  background:linear-gradient(
    90deg,
    var(--good) 0 20%,
    var(--moderate) 20% 40%,
    var(--unhealthy) 40% 60%,
    var(--very) 60% 80%,
    var(--haz) 80% 100%
  );
}

.marker{
  position:absolute;
  top:50%;
  left:20%;
  width:5px;
  height:23px;
  border-radius:5px;
  background:#fff;
  border:1px solid rgba(0,0,0,.18);
  transform:translate(-50%,-50%);
}

.footer{
  margin-top:17px;
  display:flex;
  flex-direction:column;
  gap:5px;
  color:var(--muted);
  font-size:10px;
  line-height:1.3;
}

.error{
  display:none;
  margin-top:10px;
  padding:8px 10px;
  border-radius:10px;
  background:rgba(120,0,0,.2);
  font-size:10px;
}
</style>
</head>

<body>

<main class="widget">

  <div class="top">
    <div>
      <div class="eyebrow">Pemantauan kualitas udara</div>
      <h1>Udara Samarinda</h1>
    </div>

    <button
      class="refresh"
      onclick="loadData(true)"
      aria-label="Segarkan">
      ↻
    </button>
  </div>

  <div class="value-row">
    <span id="value" class="value">--</span>
    <span class="unit">µg/m³</span>
  </div>

  <div class="meta">
    <span class="pill">
      <span id="dot" class="dot"></span>
      <span id="status">Memuat…</span>
    </span>

    <span id="trend" class="trend">—</span>
  </div>

  <div id="updated" class="updated">
    Mengambil data BMKG…
  </div>

  <div class="bar">
    <span id="marker" class="marker"></span>
  </div>

  <div class="footer">
    <span id="checked">Sumber diperiksa: —</span>
    <span>Pengukuran mengikuti ketersediaan BMKG</span>
  </div>

  <div id="error" class="error"></div>

</main>

<script>
const colors = {
  "Baik":"#22c55e",
  "Sedang":"#f6c445",
  "Tidak Sehat":"#f08a45",
  "Sangat Tidak Sehat":"#e24d6b",
  "Berbahaya":"#a855f7"
};

function markerPosition(v){

  if(v <= 15.5)
    return (v / 15.5) * 20;

  if(v <= 55.4)
    return 20 + ((v - 15.5) / (55.4 - 15.5)) * 20;

  if(v <= 150.4)
    return 40 + ((v - 55.4) / (150.4 - 55.4)) * 20;

  if(v <= 250.4)
    return 60 + ((v - 150.4) / (250.4 - 150.4)) * 20;

  return Math.min(
    98,
    80 + ((v - 250.4) / 150) * 20
  );
}

async function loadData(force=false){

  const err = document.getElementById("error");

  err.style.display = "none";

  try{

    const res = await fetch(
      "data.json?" +
      (force ? Date.now() : "v=final"),
      {cache:"no-store"}
    );

    if(!res.ok)
      throw new Error("HTTP " + res.status);

    const d = await res.json();

    const value = Number(d.value);

    document.getElementById("value").textContent =
      value.toFixed(1);

    document.getElementById("status").textContent =
      d.status;

    document.getElementById("trend").textContent =
      (
        d.trend === "Meningkat" ? "↗" :
        d.trend === "Menurun" ? "↘" :
        "→"
      ) + " " + d.trend;

    document.getElementById("updated").textContent =
      "Update BMKG: " + d.updated;

    document.getElementById("checked").textContent =
      "Sumber diperiksa: " + d.checked;

    document.getElementById("dot").style.background =
      colors[d.status] || "#fff";

    document.getElementById("marker").style.left =
      markerPosition(value) + "%";

  }catch(e){

    err.textContent =
      "Data belum tersedia. Tekan ↻ beberapa saat lagi.";

    err.style.display = "block";
  }
}

loadData();

setInterval(
  () => loadData(true),
  5 * 60 * 1000
);
</script>

</body>
</html>
