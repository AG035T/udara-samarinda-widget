<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#145de9">
<title>Udara Samarinda</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:transparent;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
}

body{
  display:flex;
  justify-content:center;
  align-items:flex-start;
  padding-top:8px;
  overflow:hidden;
}

.widget{
  width:320px;
  height:320px;
  flex:0 0 320px;
  padding:14px;
  overflow:hidden;
  border-radius:22px;
  color:#fff;
  background:linear-gradient(145deg,#216af0,#0e4fda);
  box-shadow:0 10px 24px rgba(15,70,160,.22);
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
}

.eyebrow{
  font-size:8px;
  line-height:1.1;
  font-weight:800;
  letter-spacing:.09em;
  text-transform:uppercase;
  color:#dce8ff;
  white-space:nowrap;
}

h1{
  margin:3px 0 0;
  font-size:19px;
  line-height:1;
}

.refresh{
  width:32px;
  height:32px;
  flex:0 0 32px;
  border:0;
  border-radius:10px;
  background:rgba(255,255,255,.14);
  color:#fff;
  font-size:17px;
}

.value-row{
  display:flex;
  align-items:flex-end;
  margin-top:20px;
  white-space:nowrap;
}

.value{
  font-size:64px;
  font-weight:850;
  line-height:.82;
  letter-spacing:-.055em;
}

.unit{
  margin-left:6px;
  padding-bottom:6px;
  font-size:15px;
  font-weight:700;
  color:#dce8ff;
}

.meta{
  display:flex;
  align-items:center;
  gap:7px;
  margin-top:18px;
  white-space:nowrap;
}

.pill{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:7px 10px;
  border-radius:999px;
  background:#fff;
  color:#13213a;
  font-size:11px;
  font-weight:800;
}

.dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#f6c445;
}

.trend{
  font-size:12px;
  font-weight:750;
  color:#eef4ff;
}

.updated{
  margin-top:14px;
  font-size:9px;
  font-weight:700;
  color:#dce8ff;
  white-space:nowrap;
}

.bar{
  position:relative;
  height:7px;
  margin-top:13px;
  border-radius:99px;
  background:linear-gradient(
    90deg,
    #22c55e 0 20%,
    #f6c445 20% 40%,
    #f08a45 40% 60%,
    #e24d6b 60% 80%,
    #a855f7 80% 100%
  );
}

.marker{
  position:absolute;
  top:50%;
  left:20%;
  width:4px;
  height:18px;
  border-radius:5px;
  background:#fff;
  transform:translate(-50%,-50%);
}

.footer{
  margin-top:12px;
  display:flex;
  flex-direction:column;
  gap:4px;
  font-size:8px;
  line-height:1.25;
  color:#dce8ff;
  white-space:nowrap;
}

.error{
  display:none;
  margin-top:8px;
  font-size:8px;
}
</style>
</head>

<body>

<main class="widget">

  <div class="top">
    <div>
      <div class="eyebrow">PEMANTAUAN KUALITAS UDARA</div>
      <h1>Udara Samarinda</h1>
    </div>

    <button class="refresh" onclick="loadData(true)">↻</button>
  </div>

  <div class="value-row">
    <span id="value" class="value">--</span>
    <span class="unit">µg/m³</span>
  </div>

  <div class="meta">
    <span class="pill">
      <span id="dot" class="dot"></span>
      <span id="status">Memuat…</span>
    </span>

    <span id="trend" class="trend">—</span>
  </div>

  <div id="updated" class="updated">Mengambil data BMKG…</div>

  <div class="bar">
    <span id="marker" class="marker"></span>
  </div>

  <div class="footer">
    <span id="checked">Sumber diperiksa: —</span>
    <span>Pengukuran mengikuti ketersediaan BMKG</span>
  </div>

  <div id="error" class="error"></div>

</main>

<script>
const colors={
  "Baik":"#22c55e",
  "Sedang":"#f6c445",
  "Tidak Sehat":"#f08a45",
  "Sangat Tidak Sehat":"#e24d6b",
  "Berbahaya":"#a855f7"
};

function markerPosition(v){
  if(v<=15.5) return (v/15.5)*20;
  if(v<=55.4) return 20+((v-15.5)/(55.4-15.5))*20;
  if(v<=150.4) return 40+((v-55.4)/(150.4-55.4))*20;
  if(v<=250.4) return 60+((v-150.4)/(250.4-150.4))*20;
  return Math.min(98,80+((v-250.4)/150)*20);
}

async function loadData(force=false){
  const err=document.getElementById("error");

  try{
    const res=await fetch(
      "data.json?"+(force?Date.now():"v=320"),
      {cache:"no-store"}
    );

    if(!res.ok) throw new Error();

    const d=await res.json();
    const value=Number(d.value);

    document.getElementById("value").textContent=value.toFixed(1);
    document.getElementById("status").textContent=d.status;

    document.getElementById("trend").textContent=
      (d.trend==="Meningkat"?"↗":
       d.trend==="Menurun"?"↘":"→")
      +" "+d.trend;

    document.getElementById("updated").textContent=
      "Update BMKG: "+d.updated;

    document.getElementById("checked").textContent=
      "Sumber diperiksa: "+d.checked;

    document.getElementById("dot").style.background=
      colors[d.status]||"#fff";

    document.getElementById("marker").style.left=
      markerPosition(value)+"%";

    err.style.display="none";

  }catch(e){
    err.textContent="Data belum tersedia";
    err.style.display="block";
  }
}

loadData();
setInterval(()=>loadData(true),5*60*1000);
</script>

</body>
</html>
