<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Udara Samarinda Widget Image</title>
<style>
html,body{margin:0;padding:0;background:transparent;width:100%;height:100%;overflow:hidden}
body{display:flex;align-items:flex-start;justify-content:center;padding-top:8px}
#card{display:block;width:320px;height:320px;border:0}
</style>
</head>
<body>
<img id="card" aria-hidden="true">
<script>
const card=document.getElementById('card');

function esc(s){
  return String(s??'').replace(/[&<>"']/g,c=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'
  }[c]));
}

function statusColor(status){
  return {
    "Baik":"#22c55e",
    "Sedang":"#f6c445",
    "Tidak Sehat":"#f08a45",
    "Sangat Tidak Sehat":"#e24d6b",
    "Berbahaya":"#a855f7"
  }[status] || "#f6c445";
}

function markerPosition(v){
  if(v<=15.5) return (v/15.5)*292;
  if(v<=55.4) return 58.4+((v-15.5)/(55.4-15.5))*58.4;
  if(v<=150.4) return 116.8+((v-55.4)/(150.4-55.4))*58.4;
  if(v<=250.4) return 175.2+((v-150.4)/(250.4-150.4))*58.4;
  return Math.min(286,233.6+((v-250.4)/150)*58.4);
}

function makeSvg(d){
  const v=Number(d.value)||0;
  const status=esc(d.status);
  const trend=esc(d.trend);
  const arrow=d.trend==="Meningkat"?"↗":d.trend==="Menurun"?"↘":"→";
  const dot=statusColor(d.status);
  const marker=14+markerPosition(v);
  const updated=esc(d.updated);
  const checked=esc(d.checked);

  return `
<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#216af0"/>
      <stop offset="1" stop-color="#0e4fda"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f46a0" flood-opacity=".22"/>
    </filter>
  </defs>

  <rect x="4" y="4" width="312" height="312" rx="22" fill="url(#bg)" filter="url(#shadow)"/>

  <text x="18" y="28" fill="#dce8ff" font-family="Arial, sans-serif" font-size="8" font-weight="700" letter-spacing="1">PEMANTAUAN KUALITAS UDARA</text>
  <text x="18" y="50" fill="#fff" font-family="Arial, sans-serif" font-size="19" font-weight="700">Udara Samarinda</text>

  <rect x="274" y="16" width="32" height="32" rx="10" fill="#ffffff" fill-opacity=".14"/>
  <text x="290" y="38" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="18">↻</text>

  <text x="18" y="126" fill="#fff" font-family="Arial, sans-serif" font-size="64" font-weight="800">${v.toFixed(1)}</text>
  <text x="220" y="126" fill="#dce8ff" font-family="Arial, sans-serif" font-size="15" font-weight="700">µg/m³</text>

  <rect x="18" y="148" width="108" height="30" rx="15" fill="#fff"/>
  <circle cx="31" cy="163" r="4" fill="${dot}"/>
  <text x="41" y="168" fill="#13213a" font-family="Arial, sans-serif" font-size="11" font-weight="700">${status}</text>

  <text x="137" y="168" fill="#eef4ff" font-family="Arial, sans-serif" font-size="12" font-weight="700">${arrow} ${trend}</text>

  <text x="18" y="205" fill="#dce8ff" font-family="Arial, sans-serif" font-size="9" font-weight="700">Update BMKG: ${updated}</text>

  <rect x="14" y="220" width="58.4" height="7" rx="4" fill="#22c55e"/>
  <rect x="72.4" y="220" width="58.4" height="7" fill="#f6c445"/>
  <rect x="130.8" y="220" width="58.4" height="7" fill="#f08a45"/>
  <rect x="189.2" y="220" width="58.4" height="7" fill="#e24d6b"/>
  <rect x="247.6" y="220" width="58.4" height="7" rx="4" fill="#a855f7"/>
  <rect x="${marker-2}" y="214" width="4" height="19" rx="2" fill="#fff"/>

  <text x="18" y="250" fill="#dce8ff" font-family="Arial, sans-serif" font-size="8">Sumber diperiksa: ${checked}</text>
  <text x="18" y="267" fill="#dce8ff" font-family="Arial, sans-serif" font-size="8">Pengukuran mengikuti ketersediaan BMKG</text>
</svg>`;
}

async function load(){
  try{
    const r=await fetch("data.json?t="+Date.now(),{cache:"no-store"});
    const d=await r.json();
    const svg=makeSvg(d);
    card.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg);
  }catch(e){
    const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320"><rect width="320" height="320" rx="22" fill="#145de9"/><text x="160" y="160" text-anchor="middle" fill="white" font-family="Arial" font-size="16">Data belum tersedia</text></svg>`;
    card.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg);
  }
}
load();
setInterval(load,5*60*1000);
</script>
</body>
</html>
